<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Price Stock - Top 20 & Details</title>
    <!-- โหลด Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00ffcc;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        
        /* เลย์เอาต์หลัก แบ่งเป็น ซ้าย (กราฟ+รายละเอียด) และ ขวา (รายชื่อเกม) */
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* ส่วนของรายชื่อเกม */
        .game-list-container {
            max-height: 700px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .game-list-container::-webkit-scrollbar { width: 6px; }
        .game-list-container::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .game-list-container::-webkit-scrollbar-thumb:hover { background: #00ffcc; }

        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }
        .game-item:hover, .game-item.active {
            background-color: #3a3a3a;
            border-left: 4px solid #00ffcc;
        }
        .game-title { font-weight: bold; font-size: 0.95em; }
        .game-price { font-weight: bold; font-size: 0.95em; }
        .price-down { color: #2ed573; }
        .price-up { color: #ff4757; }
        .price-stable { color: #a4b0be; }
        .rank { color: #888; font-size: 0.8em; margin-right: 10px; }

        /* ส่วนของรายละเอียดเกม (รูป + ข้อความ) */
        .game-details {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        @media (max-width: 600px) {
            .game-details {
                flex-direction: column;
            }
        }
        .game-cover {
            width: 100%;
            max-width: 320px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }
        .game-info h3 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 1.5em;
        }
        .game-info p {
            line-height: 1.6;
            color: #cccccc;
            font-size: 0.95em;
        }
        .tag {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Game Market Index</h1>
        
        <div class="dashboard">
            <!-- ฝั่งซ้าย: กราฟ + รายละเอียด -->
            <div class="left-panel">
                <!-- กราฟราคา -->
                <div class="card">
                    <h2>📈 แนวโน้มราคา 6 เดือน: <span id="selected-game" style="color:#00ffcc;"></span></h2>
                    <canvas id="priceChart"></canvas>
                </div>

                <!-- รายละเอียดเกม -->
                <div class="card game-details" id="detail-section">
                    <img id="detail-image" class="game-cover" src="" alt="Game Cover">
                    <div class="game-info">
                        <h3 id="detail-title">ชื่อเกม</h3>
                        <div>
                            <span class="tag" id="detail-dev">Developer</span>
                            <span class="tag" id="detail-genre">Genre</span>
                        </div>
                        <p id="detail-desc">คำอธิบายเกม...</p>
                    </div>
                </div>
            </div>

            <!-- ฝั่งขวา: รายชื่อเกม -->
            <div class="card">
                <h2>กระดานราคา (Top 20)</h2>
                <div class="game-list-container" id="game-container">
                    <!-- รายชื่อเกมจะถูกสร้างด้วย JavaScript -->
                </div>
            </div>
        </div>
    </div>

            { name: "Stardew Valley", current: 315, status: "stable", history: [315, 315, 315, 315, 315, 315], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/413150/header.jpg", dev: "ConcernedApe", genre: "Farming Sim", desc: "หลีกหนีความวุ่นวายมาฟื้นฟูฟาร์มเก่าของคุณปู่ ปลูกผัก เลี้ยงสัตว์ จีบสาว และสำรวจเหมือง" },
            { name: "Lethal Company", current: 195, status: "stable", history: [195, 195, 195, 195, 195, 195], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1966720/header.jpg", dev: "Zeekerss", genre: "Co-op Horror", desc: "ร่วมมือกับเพื่อนไปเก็บเศษเหล็กในดาวร้างที่เต็มไปด้วยสัตว์ประหลาดดุร้ายเพื่อทำยอดให้บริษัท" },
            { name: "EA SPORTS FC 24", current: 379, status: "down", history: [1899, 949, 569, 379, 379, 379], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2195250/header.jpg", dev: "EA Sports", genre: "Sports", desc: "ยุคใหม่ของเกมฟุตบอล (แทนที่ FIFA) พร้อมเทคโนโลยี HyperMotionV ที่ให้แอนิเมชันสมจริงที่สุด" },
            { name: "Call of Duty", current: 2490, status: "stable", history: [2490, 2490, 1743, 2490, 2490, 2490], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1938090/header.jpg", dev: "Infinity Ward", genre: "FPS", desc: "สุดยอดแฟรนไชส์เกมยิงมุมมองบุคคลที่หนึ่ง โหมด Multiplayer สุดมันส์และระบบ Gunsmith ที่แต่งปืนได้ลึก" },
            { name: "Left 4 Dead 2", current: 33, status: "down", history: [330, 33, 330, 33, 33, 33], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/550/header.jpg", dev: "Valve", genre: "Co-op Zombie FPS", desc: "เกมยิงซอมบี้ Co-op ระดับตำนานที่ยังคงมีผู้เล่นหนาแน่น พร้อมระบบ AI Director ที่ทำให้ทุกรอบไม่ซ้ำกัน" },
            { name: "Terraria", current: 219, status: "stable", history: [219, 219, 109, 219, 219, 219], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/105600/header.jpg", dev: "Re-Logic", genre: "Sandbox / Survival", desc: "ขุด สร้าง ต่อสู้ ในโลก 2D ที่เต็มไปด้วยความลับ บอสสุดโหด และไอเทมให้คราฟต์นับพันชิ้น" },
            { name: "Rust", current: 699, status: "stable", history: [699, 699, 699, 468, 699, 699], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252490/header.jpg", dev: "Facepunch Studios", genre: "Survival / PvP", desc: "ตื่นขึ้นมาตัวเปล่าบนเกาะ หาหิน ตัดไม้ สร้างฐาน และระวังผู้เล่นคนอื่นที่พร้อมจะปล้นคุณทุกเมื่อ" },
            { name: "Dead by Daylight", current: 369, status: "stable", history: [369, 184, 369, 369, 184, 369], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/381210/header.jpg", dev: "Behaviour Interactive", genre: "Asymmetrical Horror", desc: "เกมวิ่งไล่จับสุดระทึกแบบ 4vs1 ที่หนึ่งคนรับบทเป็นฆาตกร และอีกสี่คนต้องซ่อมเครื่องปั่นไฟเพื่อหนีเอาชีวิตรอด" },

            { name: "Sekiro: Shadows Die Twice", current: 895, status: "down", history: [1790, 1790, 895, 1790, 895, 895], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/814380/header.jpg", dev: "FromSoftware", genre: "Action / Souls-like", desc: "รับบทนินจาแขนกลในยุคเซ็งโงะกุ เน้นการปัดป้อง (Parry) ที่แม่นยำและการต่อสู้ที่รวดเร็วและท้าทายสุดๆ" },
            { name: "Tekken 8", current: 2190, status: "stable", history: [2190, 2190, 2190, 2190, 2190, 2190], img: "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1778820/header.jpg", dev: "Bandai Namco", genre: "Fighting", desc: "สานต่อตำนานความแค้นสายเลือดมิชิมะ ภาคใหม่ล่าสุดของเกมต่อสู้ 3D ที่กราฟิกสวยงามอลังการที่สุด" }
        ];

        // ตั้งค่ากราฟ Chart.js
        const ctx = document.getElementById('priceChart').getContext('2d');
        let priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.'],
                datasets: [{
                    label: 'ราคา (บาท)',
                    data: gameData[0].history,
                    borderColor: '#00ffcc',
                    backgroundColor: 'rgba(0, 255, 204, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#00ffcc',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#333' } },
                    x: { grid: { color: '#333' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // ฟังก์ชันอัปเดตข้อมูลทั้งหมดเมื่อคลิกเลือกเกม
        function updateDashboard(gameIndex) {
            const game = gameData[gameIndex];
            
            // 1. อัปเดตกราฟ
            document.getElementById('selected-game').innerText = game.name;
            let lineColor = game.status === 'down' ? '#2ed573' : (game.status === 'up' ? '#ff4757' : '#00ffcc');
            let bgColor = game.status === 'down' ? 'rgba(46, 213, 115, 0.1)' : (game.status === 'up' ? 'rgba(255, 71, 87, 0.1)' : 'rgba(0, 255, 204, 0.1)');
            priceChart.data.datasets[0].data = game.history;
            priceChart.data.datasets[0].borderColor = lineColor;
            priceChart.data.datasets[0].backgroundColor = bgColor;
            priceChart.data.datasets[0].pointBorderColor = lineColor;
            priceChart.update();

            // 2. อัปเดตรายละเอียดเกม (รูปภาพและข้อความ)
            document.getElementById('detail-image').src = game.img;
            document.getElementById('detail-title').innerText = game.name;
            document.getElementById('detail-dev').innerText = `ผู้พัฒนา: ${game.dev}`;
            document.getElementById('detail-genre').innerText = `แนวเกม: ${game.genre}`;
            document.getElementById('detail-desc').innerText = game.desc;

            // 3. จัดการคลาส active สำหรับเมนู
            document.querySelectorAll('.game-item').forEach((item, idx) => {
                if (idx === gameIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
        }

        // สร้างรายการเกม
        const gameContainer = document.getElementById('game-container');
        gameData.forEach((game, index) => {
            const div = document.createElement('div');
            div.className = `game-item`; 
            
            let priceClass = game.status === 'down' ? 'price-down' : (game.status === 'up' ? 'price-up' : 'price-stable');
            let arrow = game.status === 'down' ? '▼' : (game.status === 'up' ? '▲' : '-');

            div.innerHTML = `
                <div>
                    <span class="rank">#${index + 1}</span>
                    <span class="game-title">${game.name}</span>
                </div>
                <span class="game-price ${priceClass}">฿${game.current} ${arrow}</span>
            `;
            // เมื่อคลิกให้เรียกฟังก์ชัน updateDashboard
            div.onclick = () => updateDashboard(index);
            gameContainer.appendChild(div);
        });

        // โหลดข้อมูลเกมแรกสุด (Elden Ring) ขึ้นมาแสดงตอนเปิดเว็บ
        updateDashboard(0);

    </script>
</body>
</html>
