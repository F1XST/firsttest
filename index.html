<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeConvert - YouTube to MP3 & MP4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* Header */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff2a5f;
        }

        p.subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        /* Search Box */
        .search-box {
            display: flex;
            background: #1e1e24;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box button {
            background: #ff2a5f;
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: #e01e4f;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #333;
            border-top: 4px solid #ff2a5f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Result Card */
        .result-card {
            display: none;
            background: #18181c;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid #2a2a30;
            text-align: left;
        }

        .video-info {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .video-info img {
            width: 180px;
            border-radius: 8px;
            object-fit: cover;
        }

        .video-details h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #fff;
            line-height: 1.4;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #2a2a30;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #ff2a5f;
            border-bottom-color: #ff2a5f;
        }

        /* Table สำหรับปุ่มดาวน์โหลด */
        .download-table {
            width: 100%;
            border-collapse: collapse;
        }

        .download-table th, .download-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a30;
        }

        .download-table th {
            color: #888;
            font-size: 0.9rem;
        }

        .dl-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            cursor: pointer;
            transition: 0.2s;
        }

        .dl-btn:hover {
            background: #218838;
        }

        @media (max-width: 600px) {
            .video-info { flex-direction: column; }
            .video-info img { width: 100%; }
            .search-box { flex-direction: column; }
            .search-box button { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TubeConvert</h1>
        <p class="subtitle">แปลงและดาวน์โหลดวิดีโอ YouTube เป็นไฟล์ MP3 หรือ MP4 ฟรี</p>

        <!-- ช่องวาง URL -->
        <div class="search-box">
            <input type="text" id="videoUrl" placeholder="วางลิงก์ YouTube ที่นี่... (เช่น https://www.youtube.com/watch?v=...)">
            <button onclick="processVideo()">แปลงไฟล์</button>
        </div>

        <!-- ตัวหมุนแสดงการทำงาน -->
        <div class="loader" id="loader"></div>

        <!-- กล่องแสดงผลลัพธ์ -->
        <div class="result-card" id="resultCard">
            <div class="video-info">
                <img id="thumbImg" src="" alt="Thumbnail">
                <div class="video-details">
                    <h3 id="videoTitle">ชื่อวิดีโอ...</h3>
                </div>
            </div>

            <!-- แท็บเลือกรูปแบบ -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('video')">📹 วิดีโอ (MP4)</button>
                <button class="tab-btn" onclick="switchTab('audio')">🎵 เสียง (MP3)</button>
            </div>

            <!-- รายการดาวน์โหลด -->
            <table class="download-table">
                <thead>
                    <tr>
                        <th>ความละเอียด / ฟอร์แมต</th>
                        <th>สถานะ</th>
                        <th>ดาวน์โหลด</th>
                    </tr>
                </thead>
                <tbody id="downloadOptions">
                    <!-- รายการสร้างผ่าน JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentVideoUrl = '';

        // ดึง ID ของวิดีโอจากลิงก์ YouTube ทุกรูปแบบ (รวมถึงลิงก์สั้นแบบ youtu.be และลิงก์ที่มี ?si=)
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');

            if (!urlInput) {
                alert('กรุณากรอกลิงก์ YouTube ครับ');
                return;
            }

            const videoId = getYouTubeId(urlInput);
            if (!videoId) {
                alert('รูปแบบลิงก์ YouTube ไม่ถูกต้อง');
                return;
            }

            // จัดฟอร์แมตให้อยู่ในรูป URL มาตรฐานที่ไม่มีพารามิเตอร์ส่วนเกิน
            currentVideoUrl = `https://www.youtube.com/watch?v=${videoId}`;
            
            loader.style.display = 'block';
            resultCard.style.display = 'none';

            // ดึงรูป Thumbnail มาพรีวิว
            document.getElementById('thumbImg').src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
            document.getElementById('videoTitle').innerText = "YouTube Video (" + videoId + ")";

            switchTab('video');

            loader.style.display = 'none';
            resultCard.style.display = 'block';
        }

        function switchTab(type) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons[0].classList.toggle('active', type === 'video');
            buttons[1].classList.toggle('active', type === 'audio');

            const tbody = document.getElementById('downloadOptions');
            tbody.innerHTML = '';

            if (type === 'video') {
                const qualities = [
                    { label: '1080p (Full HD)', picker: '1080' },
                    { label: '720p (HD)', picker: '720' },
                    { label: '480p (SD)', picker: '480' },
                    { label: '360p (Low)', picker: '360' }
                ];

                qualities.forEach(q => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>MP4 (${q.label})</td>
                        <td style="color:#2ed573;">พร้อมดาวน์โหลด</td>
                        <td><button class="dl-btn" onclick="downloadMedia('video', '${q.picker}')">📥 ดาวน์โหลด</button></td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>MP3 (Audio Only - Best Quality)</td>
                    <td style="color:#2ed573;">พร้อมดาวน์โหลด</td>
                    <td><button class="dl-btn" onclick="downloadMedia('audio', 'audio')">📥 ดาวน์โหลด</button></td>
                `;
                tbody.appendChild(row);
            }
        }

        // ฟังก์ชันดึงลิงก์พร้อมระบบสลับเซิร์ฟเวอร์สำรอง
        async function downloadMedia(type, quality) {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            // รายชื่อ Cobalt API Instances สำรองกรณีตัวหลักติดข้อจำกัด
            const apiEndpoints = [
                'https://api.cobalt.tools/',
                'https://cobalt.kwiatekmandarynka.pl/'
            ];

            let isDownloaded = false;

            for (const apiUrl of apiEndpoints) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: currentVideoUrl,
                            videoQuality: quality,
                            downloadMode: type === 'audio' ? 'audio' : 'auto'
                        })
                    });

                    const data = await response.json();

                    if (data.url) {
                        window.open(data.url, '_blank');
                        isDownloaded = true;
                        break;
                    } else if (data.picker && data.picker.length > 0) {
                        window.open(data.picker[0].url, '_blank');
                        isDownloaded = true;
                        break;
                    }
                } catch (err) {
                    console.warn(`การเชื่อมต่อผ่าน ${apiUrl} ล้มเหลว กำลังลองเซิร์ฟเวอร์สำรอง...`);
                }
            }

            if (!isDownloaded) {
                alert('ไม่สามารถดึงลิงก์ดาวน์โหลดได้ในขณะนี้ (เซิร์ฟเวอร์ปลายทางอาจติดข้อจำกัดความเร็ว) กรุณาลองใหม่อีกครั้งครับ');
            }

            loader.style.display = 'none';
        }
    </script>
</body>
</html>
